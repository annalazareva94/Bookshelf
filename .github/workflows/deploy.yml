name: Deploy

on:
  push:
    branches: [ main, master ]

jobs:
# ---- 1. ЗАПУСК ТЕСТОВ (бэкенд) ----
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./   # так как manage.py в корне, не в папке backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # если у вас есть requirements.txt
          # Если нет, установите нужные пакеты вручную:
          # pip install django djangorestframework djangorestframework-simplejwt pillow
      - name: Run Django tests
        env:
          SECRET_KEY: 'dummy-for-tests'
          DEBUG: 'True'
          DATABASE_URL: 'sqlite:///test_db.sqlite3'   # опционально
        run: |
          python manage.py test
          
  # ---- 2. ДЕПЛОЙ (запускается только после успешных тестов и только на push) ----
  deploy:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      # ---- 1. Сборка React ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        run: |
          cd frontend
          npm install
      - name: Build React
        run: |
          cd frontend
          npm run build   # создаст папку frontend/dist

      # ---- 2. Копирование бэкенда (Django) ----
      - name: Deploy backend
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rlgoDzvc -i --delete --exclude="frontend" --exclude="venv" --exclude="__pycache__" --exclude="*.pyc" --exclude="db.sqlite3" --exclude=".env" --exclude="node_modules" --exclude=".git" --exclude=".idea" --exclude="*.log"'
          SOURCE: './'   # весь корень репозитория
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: '/var/www/book-shelf/backend'   # Django-код попадёт сюда

      # ---- 3. Копирование фронтенда (React) ----
      - name: Deploy frontend
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rlgoDzvc -i --delete'
          SOURCE: 'frontend/dist/'   # папка после сборки
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: '/var/www/book-shelf'   # прямо в корень сайта (где index.html)

      # ---- 4. Миграции, статика, перезапуск Gunicorn ----
      - name: Run Django migrations and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/book-shelf/backend
            source venv/bin/activate
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            chown -R www-data:www-data /var/www/book-shelf/static /var/www/book-shelf/media
            systemctl restart gunicorn
            systemctl reload nginx
